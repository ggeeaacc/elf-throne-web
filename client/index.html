<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>精灵王座：破晓之契 · 联机测试版</title>
    <style>
      /* 奇幻深色森林主题：墨绿苔原底 + 羊皮纸金 */
      :root {
        --gold: #e2c47c; --gold-dim: #c2a05c; --parch: #e8dfc5;
        --sc-city: #d8b36a; --sc-elf: #6fc97a; --sc-ruins: #a89ec9; --sc-valley: #c96a8a;
      }
      body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 16px; background: radial-gradient(1200px 800px at 20% -10%, #1c2e1c 0%, #121d12 45%, #0b120b 100%); color: var(--parch); font-size: 14px; }
      h1 { font-size: 18px; margin: 4px 0 10px; color: var(--gold); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
      h2 { font-size: 14px; color: var(--gold-dim); margin: 10px 0 4px; }
      fieldset { border: 1px solid #3a4a34; margin-bottom: 10px; background: rgba(20,30,18,.5); border-radius: 4px; }
      legend { color: var(--gold-dim); }
      input, select, button { font: inherit; padding: 3px 8px; margin: 2px; background: #1d2a1c; color: var(--parch); border: 1px solid #41563a; border-radius: 3px; }
      button { cursor: pointer; } button:hover { background: #28391f; border-color: #5a7248; } button:disabled { opacity: .38; cursor: default; }
      button.sel { border-color: var(--gold); background: #3a2f16; }
      button.no { opacity: .45; border-style: dashed; cursor: not-allowed; }
      .pickChar { margin: 1px 2px; padding: 2px 8px; font-size: 13px; }
      .pickChar.taken { color: #5a5a5a; text-decoration: line-through; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
      .col { flex: 1 1 460px; min-width: 380px; }
      .dim { color: #93a08b; font-size: 12px; }
      .panel { background: rgba(24,32,20,.92); border: 1px solid #31422c; border-radius: 4px; padding: 8px; margin-bottom: 8px; }
      .panel.turn { border-color: var(--gold); box-shadow: 0 0 12px rgba(226,196,124,.35); }
      /* 你的回合横幅 */
      #turnBanner { background: linear-gradient(90deg, #3a2f16, #57461f, #3a2f16); border: 1px solid var(--gold); color: var(--gold); border-radius: 4px; padding: 6px 10px; margin-bottom: 8px; font-weight: 700; text-align: center; letter-spacing: 1px; animation: bannerPulse 2s ease-in-out infinite; }
      @keyframes bannerPulse { 0%,100% { box-shadow: 0 0 4px rgba(226,196,124,.25); } 50% { box-shadow: 0 0 14px rgba(226,196,124,.55); } }
      /* 版图：2x2 网格 + 邻接连线底图（连线数据来自引擎 SCENES.adjacent） */
      .board { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .links { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
      .links line { stroke: #5a7248; stroke-width: 2.5; opacity: .75; }
      .scene { position: relative; z-index: 1; background: #1a2418; border: 1px solid #33422e; border-left: 4px solid var(--sc, #556); border-radius: 4px; padding: 12px; min-height: 200px; }
      .scene-human_city { --sc: var(--sc-city); }
      .scene-elf_kingdom { --sc: var(--sc-elf); }
      .scene-ancient_battlefield { --sc: var(--sc-ruins); }
      .scene-dark_valley { --sc: var(--sc-valley); }
      .scene b { color: var(--sc, var(--parch)); }
      .scene .here { color: var(--gold); font-size: 12px; }
      /* 移动编排：相邻高亮 / 非相邻置灰 / 当前场景标记 */
      .scene.move-ok { border-color: #58d68a; box-shadow: 0 0 10px rgba(88,214,138,.45); cursor: pointer; }
      .scene.move-no { opacity: .45; filter: grayscale(.7); cursor: not-allowed; }
      .scene.move-cur { outline: 2px dashed var(--gold); outline-offset: 2px; }
      .hint { color: #ffd166; font-size: 12px; margin-left: 8px; }
      .badge { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 9px; background: #a03a3a; color: #fff; font-size: 11px; text-align: center; margin-left: 5px; vertical-align: 2px; }
      /* 素材：头像 / 场景头图 / 首领 */
      .avatar { width: 96px; height: 96px; object-fit: contain; vertical-align: middle; margin-right: 8px; background: rgba(232,223,197,.08); border: 1px solid #3a4a34; border-radius: 50%; padding: 2px; }
      .scene-icon { width: 64px; height: 64px; object-fit: contain; vertical-align: middle; margin-right: 6px; }
      .boss-img { width: 120px; height: 120px; object-fit: contain; vertical-align: middle; margin-right: 8px; }
      .crisis { display: inline-block; background: #2d1f26; border: 1px solid #5a3a4a; border-radius: 3px; padding: 3px 8px; margin: 3px; font-size: 14px; }
      .crisis .crisis-fx { display: block; font-size: 11px; color: #aab89e; margin-top: 2px; }
      .crisis.dark { border-color: #a03a5a; }
      .crisis.sel { border-color: var(--gold); background: #4a3a16; }
      .chip { display: inline-block; background: #1f2a1a; border: 1px solid #3a5a34; border-radius: 3px; padding: 1px 6px; margin: 1px; font-size: 12px; }
      .card { display: inline-block; background: #26301f; border: 1px solid #4a5a3a; border-radius: 3px; padding: 2px 6px; margin: 2px; font-size: 12px; cursor: pointer; }
      .card.sel { border-color: var(--gold); background: #4a3a16; }
      .card .mat { color: var(--gold); }
      /* 悬停浮层：卡面原文（宿主挂 .hastip，内嵌 .tip）；触屏点选切换挂 .tip-open */
      .hastip { position: relative; }
      .hastip .tip { display: none; position: absolute; left: 0; top: calc(100% + 4px); z-index: 60; width: 250px; max-height: 320px; overflow-y: auto; padding: 6px 8px; background: #10160e; border: 1px solid #5a7248; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.55); font-size: 12px; line-height: 1.5; color: #e8dfc5; white-space: normal; pointer-events: auto; }
      .hastip:hover .tip, .hastip.tip-open .tip { display: block; }
      .hastip.tip-open { z-index: 70; }
      /* 浮层打开时提升所在场景层级，避免被相邻场景遮挡 */
      .scene:has(.tip-open), .scene:has(.hastip:hover) { z-index: 50; }
      .hastip .tip b { color: var(--gold); }
      /* 手牌卡块：首行卡名+徽标，效果小字常显 */
      .handcard { display: block; background: #232d1e; border: 1px solid #4a5a3a; border-radius: 4px; padding: 6px 10px; margin: 5px 0; cursor: pointer; }
      .handcard:hover { background: #2c3a24; }
      .handcard.sel { border-color: var(--gold); background: #4a3a16; }
      .handcard .hd { font-size: 15px; }
      .handcard .fx { font-size: 13px; color: #c3ccb2; line-height: 1.5; margin-top: 3px; }
      .handcard .mat { color: var(--gold); }
      .tag { display: inline-block; background: #18220f; border: 1px solid #3a4a2f; border-radius: 3px; padding: 0 4px; margin: 0 1px; font-size: 11px; color: #b9d19a; }
      .tag.ap { color: #7aff9a; }
      .tag.remote { color: #d0a0ff; }
      .opt { margin: 3px 0; }
      .opt .dim { margin-left: 6px; }
      /* 事件日志按类型着色：伤害红 / 治疗绿 / 系统灰 / 决策黄 / 错误亮红 */
      #log { background: #0d120c; border: 1px solid #2a3324; padding: 8px; height: 220px; overflow: auto; font-size: 13px; }
      #log div { white-space: pre-wrap; }
      #log .l-dmg { color: #ff8a8a; }
      #log .l-heal { color: #7ae08a; }
      #log .l-sys { color: #8a93a5; }
      #log .l-dec { color: #ffd166; }
      #log .l-err { color: #ff6a6a; font-weight: 700; }
      #log .l-ai { color: #7ad0e0; }
      .decision { border: 2px solid var(--gold); background: #2a2413; }
      .boss { border-color: #7a3a5a; background: #241722; }
      .hpbar { color: #ff7a7a; } .ap { color: #7aff9a; } .tok { color: #c9c9c9; font-size: 12px; }
      table.state td { padding: 1px 6px; vertical-align: top; }
      /* 四阶段进度条 */
      .phase-bar { font-size: 12px; margin-bottom: 4px; padding: 4px 8px; background: rgba(24,32,20,.6); border-radius: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
      .phase-step { padding: 1px 8px; border-radius: 10px; }
      .phase-now { background: rgba(226,196,124,.25); color: var(--gold); font-weight: 700; }
      .phase-done { color: #5a6a4a; text-decoration: line-through; }
      .phase-next { color: #3a4a30; }
      /* 背景音乐播放器 */
      #bgmBtn { position: fixed; top: 12px; right: 14px; z-index: 200; display: flex; align-items: center; gap: 6px; background: rgba(20,30,18,.85); border: 1px solid var(--gold-dim); border-radius: 20px; padding: 4px 12px 4px 8px; cursor: pointer; font-size: 13px; color: var(--parch); transition: border-color .2s; }
      #bgmBtn:hover { border-color: var(--gold); }
      #bgmBtn .icon { font-size: 16px; }
      #bgmBtn.playing .icon { animation: spin 3s linear infinite; }
      @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    </style>
  </head>
  <body>
    <audio id="bgm" loop preload="none" crossorigin="anonymous">
      <source src="https://music.163.com/song/media/outer/url?id=417859631.mp3" type="audio/mpeg">
    </audio>
    <div id="bgmBtn" title="点击播放/暂停背景音乐"><span class="icon">🎵</span><span class="label">播放音乐</span></div>
    <h1>精灵王座：破晓之契 · 联机测试版</h1>
    <fieldset id="lobby">
      <legend>房间</legend>
      <input id="name" placeholder="昵称" value="玩家" />
      <button id="create">创建房间</button>
      <input id="roomId" placeholder="房间码" size="6" />
      <button id="join">加入房间</button>
      <button id="rejoin">重连</button>
      <span id="roomInfo" class="dim"></span>
      <div id="players"></div>
      <div id="startRow" style="display:none">
        <select id="bench"><option value="baye">三人局弃巴爷</option><option value="kaier">三人局弃凯尔</option></select>
        <button id="start">开始游戏（主机）</button>
        <button id="addAi" style="display:none">+ AI 补位</button>
        <button id="shuffleSeats" style="display:none">🔀 随机座位</button>
      </div>
    </fieldset>
    <div id="game" style="display:none">
      <div id="turnBanner" style="display:none"></div>
      <div id="status" class="panel"></div>
      <div id="decision" class="panel decision" style="display:none"></div>
      <div class="row">
        <div class="col">
          <div id="scenes"></div>
          <div id="bossPanel"></div>
          <div id="equipDisplay"></div>
        </div>
        <div class="col">
          <div id="chars"></div>
          <h2>行动</h2>
          <div id="actions" class="panel"></div>
          <h2>手牌</h2>
          <div id="hand" class="panel"></div>
        </div>
        <div class="col">
          <h2>事件日志</h2>
          <div id="log"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
